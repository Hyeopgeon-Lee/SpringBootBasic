name: Spring Boot 4 Maven and MariaDB verification
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: myDB
          MARIADB_USER: poly
          MARIADB_PASSWORD: test_only_poly
          MARIADB_ROOT_PASSWORD: test_only_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      INTEGRATION_DB_URL: jdbc:mariadb://127.0.0.1:3306/myDB
      INTEGRATION_DB_USERNAME: poly
      INTEGRATION_DB_PASSWORD: test_only_poly

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile, unit tests, MariaDB CRUD tests and WAR packaging
        run: bash ./mvnw -B -ntp clean verify
