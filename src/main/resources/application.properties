# Spring Boot 4 / Java 17 teaching application
server.port=${SERVER_PORT:11000}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/myDB}
spring.datasource.username=${DB_USERNAME:poly}
spring.datasource.password=${DB_PASSWORD:}

mybatis.type-aliases-package=kopo.poly.dto
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.mail.host=${MAIL_HOST:smtp.naver.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.naver.com}

ocr.model.data=${OCR_MODEL_DATA:}
ocr.upload-dir=${OCR_UPLOAD_DIR:${java.io.tmpdir}/springbootbasic-ocr}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

weather.api.key=${WEATHER_API_KEY:}
naver.papago.clientId=${NAVER_CLIENT_ID:}
naver.papago.clientSecret=${NAVER_CLIENT_SECRET:}

logging.level.org.springframework.cache=INFO
logging.level.kopo.poly=INFO
